# Mosquitto MQTT Broker Configuration - Smart Agriculture

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Development only: open access, no auth.
# For production, set allow_anonymous false and configure password_file / ACLs.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
